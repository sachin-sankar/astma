[project]
name = "skill-bundles-analysis"
version = "0.1.0"
description = "Skill Bundles and Freelancer Earnings Analysis Pipeline and Dashboard"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
    "python-louvain>=0.16",
    "mlxtend>=0.23.0",
    "plotly>=5.20.0",
    "dash>=2.16.0",
    "dash-bootstrap-components>=1.6.0",
    "statsmodels>=0.14.0",
    "loguru>=0.7.3",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "dashboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
